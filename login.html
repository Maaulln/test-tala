<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Masuk — Kampus Demo SSO</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-login>
  <div class="login-box">
    <header><h1>Kampus Demo — Layanan Masuk Terpusat</h1></header>
    <div class="card">
      <h2>Masukkan NetID dan kata sandi</h2>

      <p id="info" class="notice info" hidden></p>
      <p id="error" class="notice error" role="alert" hidden></p>

      <form id="login-form" class="stack" autocomplete="on">
        <div>
          <label for="username">NetID</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Kata sandi</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="check">
          <input id="warn" name="warn" type="checkbox">
          <label for="warn">Ingatkan saya sebelum masuk ke situs lain.</label>
        </div>
        <div>
          <button id="submit" name="submit" type="submit">LOGIN</button>
        </div>
      </form>
    </div>
  </div>
  <footer>Situs demo untuk menguji otomasi. Data fiktif, bukan situs kampus sungguhan.</footer>
  <script src="assets/site.js"></script>
</body>
</html>
